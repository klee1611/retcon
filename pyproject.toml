[project]
name = "retcon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "langchain-groq>=1.1.3",
    "langgraph==1.2.22",
    "langgraph-store-mongodb==0.4.0",
    "langsmith>=0.14.17",
    "pymongo==4.20.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "voyageai>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
