<!doctype html>
<html><head><meta charset="utf-8"><title>Retcon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font:18px/1.4 system-ui,sans-serif}
header{padding:14px 24px;border-bottom:1px solid #30363d;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:28px} h2{margin:0 0 10px;font-size:22px;color:#8b949e}
#live{font-size:14px;color:#8b949e} #live.on{color:#3fb950} #live.err{color:#f85149;font-weight:700}
.ev.r{border-color:#6e7681}.ev.rb{border-color:#d29922}.b-r{background:#6e7681}.b-rb{background:#9e6a03}
main{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;padding:16px;height:calc(100vh - 140px)}
section{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;overflow:auto}
.ev{border-left:4px solid #30363d;padding:8px 10px;margin-bottom:10px;background:#0d1117;border-radius:4px}
.ev.q{border-color:#f85149}.ev.s{border-color:#3fb950}
.meta{font-size:14px;color:#8b949e}
.badge{font-size:13px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;color:#fff}
.b-q{background:#da3633}.b-s{background:#238636}.b-t{background:#30363d;color:#c9d1d9}
button,select{font:inherit;font-size:15px;padding:4px 10px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e6edf3;cursor:pointer}
button:hover{background:#30363d}
.bar{height:16px;background:#30363d;border-radius:8px;overflow:hidden}.bar>div{height:100%}
.bad{color:#f85149;font-weight:700}
#diff{padding:0 24px;font-size:15px;white-space:pre-wrap;max-height:90px;overflow:auto}
.add{color:#3fb950}.rem{color:#f85149}.chg{color:#d29922}
</style></head><body>
<header><h1>Retcon</h1><span id="live">connecting...</span>
<span style="margin-left:auto"><button onclick="clearTimeline()">Clear timeline</button> Rollback to <select id="hist"></select> <button onclick="rollback()">Rollback</button></span></header>
<div id="diff"></div>
<main>
<section><h2>Memory timeline</h2><div id="timeline"></div></section>
<section><h2>Quarantine</h2><div id="quarantine"></div></section>
<section><h2>Sources &amp; trust</h2><div id="sources"></div>
<h2 style="margin-top:20px">Refunds issued</h2><div id="refunds"></div></section>
</main>
<script>
const POISON="9988-1122-3344";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?new Date(t).toLocaleTimeString():"";
const sources={}, quarantine={}, refunds=[], histTimes=[];
function srcType(s){return s&&s.type||"?"}

function addTimeline(kind,doc,at){
  const v=doc.value||{}, s=v.source||doc.source||{};
  const ns=(doc.namespace||[]).join("/");
  const text=v.text||(doc.value&&doc.value.text)||"";
  const el=document.createElement("div");
  el.className="ev "+(kind==="q"?"q":"s");
  el.innerHTML=`<div class="meta">${fmt(at)} &middot; ${esc(ns)} / ${esc(doc.key)}
   <span class="badge b-t">${esc(srcType(s))}</span>
   <span class="badge ${kind==="q"?"b-q":"b-s"}">${kind==="q"?"QUARANTINED":"SAVED"}</span></div>
   <div>${esc(text)}</div>`;
  $("timeline").prepend(el);
}
function addHistoryRow(h,at){
  const rb=h.op==="rollback", cls=rb?"rb":"s";
  const txt=v=>v==null?"(none)":esc((v&&v.text)??JSON.stringify(v));
  const el=document.createElement("div");
  el.className="ev "+(rb?"rb":"s");
  el.innerHTML=`<div class="meta">${fmt(at)} &middot; ${esc((h.namespace||[]).join("/"))} / ${esc(h.key)}
   <span class="badge b-rb">${rb?"ROLLED BACK":h.op==="forget"?"FORGOTTEN":"RELEASED"}</span></div>
   <div>${txt(h.value_before)} &rarr; ${txt(h.value_after)}</div>`;
  $("timeline").prepend(el);
}
function addRemoved(doc,at){
  const el=document.createElement("div");
  el.className="ev r";
  const where=doc.key?`${esc(doc.namespace_str||(doc.namespace||[]).join("/"))} / ${esc(doc.key)}`:"memory "+esc(doc._id);
  el.innerHTML=`<div class="meta">${fmt(at)} &middot; ${where}
   <span class="badge b-r">REMOVED</span></div>`;
  $("timeline").prepend(el);
}
function clearTimeline(){$("timeline").innerHTML="";$("diff").innerHTML="";}
// A new demo run cleared the database: wipe every panel, not just the timeline.
function resetAll(){
  clearTimeline();
  for(const k in sources)delete sources[k];
  for(const k in quarantine)delete quarantine[k];
  refunds.length=0; histTimes.length=0;
  renderSources();renderQuarantine();renderRefunds();renderHist();
}
function renderQuarantine(){
  const items=Object.values(quarantine).filter(d=>d.status==="held");
  $("quarantine").innerHTML=items.map(d=>{
    const s=d.source||{};
    return `<div class="ev q"><div>${esc((d.value||{}).text)}</div>
    <div class="meta">reason: ${esc(d.reason)}<br>rule: <b>${esc(d.rule)}</b> &middot; source: ${esc(srcType(s))}:${esc(s.id)}</div>
    <div style="margin-top:6px"><button onclick="act('${d._id}','release')">Release</button>
    <button onclick="act('${d._id}','delete')">Delete</button></div></div>`}).join("")||'<div class="meta">empty</div>';
}
function renderSources(){
  $("sources").innerHTML=Object.values(sources).map(s=>{
    const t=s.trust??0, c=t>=60?"#3fb950":t>=40?"#d29922":"#f85149";
    return `<div style="margin-bottom:10px"><div>${esc(s._id)} <span class="meta">trust ${t} &middot; blocked ${s.blocked||0}</span></div>
    <div class="bar"><div style="width:${t}%;background:${c}"></div></div></div>`}).join("")||'<div class="meta">none</div>';
}
function renderRefunds(){
  $("refunds").innerHTML=refunds.map(r=>`<div class="ev ${r.account===POISON?"q":"s"}">
   <div class="meta">${fmt(r.at)} &middot; ${esc(r.run_label)} &middot; order ${esc(r.order_id)}</div>
   <div>to <span class="${String(r.account).includes(POISON)?"bad":""}">${esc(r.account)}</span></div></div>`).join("")||'<div class="meta">none</div>';
}
function renderHist(){
  const sel=$("hist"), cur=sel.value;
  sel.innerHTML=histTimes.slice(0,30).map(t=>`<option value="${t}">${new Date(t).toLocaleTimeString()}</option>`).join("");
  if(cur&&histTimes.includes(cur))sel.value=cur;
}
async function act(id,what){
  const r=await fetch(`/quarantine/${id}/${what}`,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
  if(!r.ok)$("diff").innerHTML=`<span class="rem">${esc(what)} failed: ${r.status}</span>`;
}
async function rollback(){
  const at=$("hist").value; if(!at)return;
  const r=await fetch("/rollback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({at})});
  if(!r.ok){$("diff").innerHTML=`<span class="rem">Rollback failed: ${r.status}</span>`;return;}
  const d=await r.json(), line=(c,sym,x)=>`<div class="${c}">${sym} ${esc((x.namespace||[]).join("/"))}/${esc(x.key)}: ${esc(JSON.stringify(x.before?.text??x.before??""))} ${sym==="~"?"-> "+esc(JSON.stringify(x.after?.text??x.after)):""}</div>`;
  $("diff").innerHTML="<b>Rollback diff</b>"+(d.added||[]).map(x=>line("add","+",x)).join("")
    +(d.removed||[]).map(x=>line("rem","-",x)).join("")+(d.changed||[]).map(x=>line("chg","~",x)).join("");
}
function handle(ev){
  const {collection:c,op,doc,at}=ev;
  if(c==="_error"){$("live").textContent="ERROR: "+((doc&&doc.error)||"watcher stopped")+" (retrying)";$("live").className="err";
    es&&es.close();setTimeout(connect,3000);return;}
  if(c==="demo_runs"){if(op==="insert")resetAll();return;}
  if(c==="memories"&&op==="delete")addRemoved(doc,at);
  else if(c==="memories"&&doc.value)addTimeline("s",doc,at);
  else if(c==="quarantine"){
    if(op==="insert")addTimeline("q",doc,at);
    if(op==="delete")delete quarantine[doc._id]; else quarantine[doc._id]=doc;
    renderQuarantine();
  }else if(c==="sources"){
    if(op==="delete")delete sources[doc._id]; else sources[doc._id]={...sources[doc._id],...doc};
    renderSources();
  }else if(c==="refunds"){
    if(op==="insert")refunds.unshift(doc);
    else if(op==="delete"){const i=refunds.findIndex(r=>r._id===doc._id);if(i>=0)refunds.splice(i,1);}
    renderRefunds();
  }
  else if(c==="memory_history"&&doc.at){
    if(op==="insert"&&(doc.op==="rollback"||doc.op==="release"||doc.op==="forget"))addHistoryRow(doc,at||doc.at);
    histTimes.unshift(doc.at);renderHist();}
}
async function init(){
  const s=await (await fetch("/state")).json();
  s.sources.forEach(x=>sources[x._id]=x);
  s.quarantine.forEach(x=>quarantine[x._id]=x);
  refunds.push(...s.refunds);
  histTimes.push(...s.history.map(h=>h.at).filter(Boolean));
  renderSources();renderQuarantine();renderRefunds();renderHist();
  s.history.slice().reverse().forEach(h=>{
    if(h.op==="delete")return;
    if(h.op==="rollback"||h.op==="release"||h.op==="forget")return addHistoryRow(h,h.at);
    addTimeline("s",{namespace:h.namespace,key:h.key,value:h.value_after,source:h.source},h.at);
  });
  s.quarantine.slice().reverse().forEach(d=>addTimeline("q",d,d.created_at));
  connect();
}
let es=null;
function connect(){
  if(es)es.close();
  es=new EventSource("/events");
  es.onopen=()=>{$("live").textContent="LIVE";$("live").className="on"};
  es.onerror=()=>{$("live").textContent="reconnecting...";$("live").className=""};
  es.onmessage=e=>handle(JSON.parse(e.data));
}
init();
</script></body></html>
